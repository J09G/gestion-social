# Configuración mínima para tests - no requiere MongoDB real
spring.data.mongodb.uri=mongodb://localhost:27017/test_bodega_social
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoRepositoriesAutoConfiguration

# JWT para tests
jwt.secreto=clave-secreta-de-32-caracteres-minimo-para-tests
jwt.expiracion=3600000

# Admin inicial
admin.correo=admin@test.com
admin.contrasena=admin123

# CORS
frontend.url=http://localhost:5173