spring.application.name=gestion-social

# Puerto (Railway inyecta PORT)
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bodega_social}

# JWT
jwt.secreto=${JWT_SECRET:dev-super-secreto-para-gestion-social-cambiar-en-produccion}
jwt.expiracion=28800000

# Admin inicial
admin.correo=${ADMIN_EMAIL:admin@bodega.gov.co}
admin.contrasena=${ADMIN_PASSWORD:Admin12345}

# CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}